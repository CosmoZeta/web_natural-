<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos - Tienda Natural</title>
  <link rel="stylesheet" href="../css/styles.css">
 </head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="store-section">
      <h2 class="store-title">TIENDA</h2>
      <section class="products-grid">
        <div class="grid store-grid">
          <article class="product-card">
            <div class="img-wrap">
              <img src="/images/colagen_producto1.png" alt="AVENA 100% INTEGRAL">
              </div>
            <div class="card-body">
              <h3>COLÁGENO REJUVEGEN 500 </h3>
              <div class="price">S/15.00</div>
            </div>
          </article>

          <article class="product-card">
            <div class="img-wrap">
              <img src="/images/citrato_magnesio2.png" alt="CACAO ORGÁNICO">
              </div>
            <div class="card-body">
              <h3>CITRATO DE MAGNESIO 500 GR</h3>
              <div class="price">S/22.00</div>
            </div>
          </article>

          <article class="product-card">
            <div class="img-wrap">
              <img src="/images/cloruro_magnesio1.png" alt="CAFÉ ECOLÓGICO">
              </div>
            <div class="card-body">
              <h3>CLORURO DE MAGNESIO 500 GR</h3>
              <div class="price">S/30.00</div>
            </div>
          </article>

          <!-- Más productos... -->
        </div>
      </section>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="../js/include-partials.js" defer></script>
  <script src="../js/main.js" defer></script>
</body>
</html>
